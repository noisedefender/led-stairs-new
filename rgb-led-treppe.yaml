substitutions:

  # ============================================================
  # HARDWARE
  # ============================================================

  lightlevel_pin: GPIO1
  pir_down_pin: GPIO2
  pir_up_pin: GPIO3
  led_pin: GPIO4

  # ============================================================
  # STAIR TIMING
  # ============================================================

  # Максимальное время работы после срабатывания PIR,
  # если движение на противоположном конце не обнаружено.
  timeout_seconds: 60s

  # Задержка перед началом выключения после PIR
  # на противоположном конце.
  switchoff_delay_seconds: 10s

  # После полного выключения лестница некоторое время
  # игнорирует PIR.
  cooldown_seconds: 5s

  # ============================================================
  # EFFECTS USED BY PIR
  # ============================================================

  led_effect_up: "Stufenlicht rauf colorized"
  led_effect_down: "Stufenlicht runter colorized"

  led_effect_up_off: "Stufenlicht rauf aus"
  led_effect_down_off: "Stufenlicht runter aus"

  led_effect_off_timeout: 10s

  # ============================================================
  # STAIR CONFIGURATION
  # ============================================================

  stufen_anzahl: "16"

  # Количество LED на каждой ступени.
  # Сумма должна совпадать с led_anzahl.
  leds_pro_stufe: "{36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36}"

  # Цвет каждой ступени.
  # RGB 0..255.
  farbe_je_stufe: "{Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181)}"

  # Общее количество LED.
  led_anzahl: "576"

  # ============================================================
  # LIGHT SENSOR
  # ============================================================

  light_sensor_active: "false"

  # При значении ниже этого уровня лестница разрешена.
  lightlevel_maxvalue: "0.7"

  # ============================================================
  # SUN
  # ============================================================

  sun_active: "false"

  latitude: "51.138374°"
  longitude: "7.185790°"

  # ============================================================
  # WIFI
  # ============================================================

  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password


# ==============================================================
# ESPHOME
# ==============================================================

esphome:
  name: shys-rgb-treppe
  friendly_name: SHYS RGB Treppe

  on_boot:
    priority: 500
    then:
      - switch.turn_on: treppe_aktiv


# ==============================================================
# ESP32-S3
# ==============================================================

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino


# ==============================================================
# WIFI
# ==============================================================

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

  ap:
    ssid: "SHYS RGB Treppe Fallback"
    password: !secret fallback_password


# ==============================================================
# LOGGER
# ==============================================================

logger:


# ==============================================================
# API
# ==============================================================

api:


# ==============================================================
# OTA
# ==============================================================

ota:
  - platform: esphome


# ==============================================================
# CAPTIVE PORTAL
# ==============================================================

captive_portal:


# ==============================================================
# GLOBALS
# ==============================================================

globals:

  # true во время движения снизу вверх
  - id: treppe_rauf_laeuft
    type: bool
    restore_value: no
    initial_value: "false"

  # true во время движения сверху вниз
  - id: treppe_runter_laeuft
    type: bool
    restore_value: no
    initial_value: "false"


# ==============================================================
# SUN
# ==============================================================

sun:
  latitude: ${latitude}
  longitude: ${longitude}


# ==============================================================
# TIME
# ==============================================================

time:

  - platform: homeassistant
    id: local_time

  - platform: sntp
    id: sntp_time


# ==============================================================
# TEXT SENSOR
# ==============================================================

text_sensor:

  - platform: template
    name: "Treppen-Status"
    id: treppen_status
    lambda: |-
      return {"idle"};


# ==============================================================
# LIGHT SENSOR
# ==============================================================

sensor:

  - platform: adc
    pin: ${lightlevel_pin}
    name: "RGB-Treppe Helligkeitssensor"
    id: rgbtreppe_helligkeitssensor
    update_interval: 30s


# ==============================================================
# PIR SENSORS
# ==============================================================

binary_sensor:

  # ------------------------------------------------------------
  # PIR BOTTOM
  # ------------------------------------------------------------

  - platform: gpio
    pin:
      number: ${pir_down_pin}
      mode:
        input: true

    name: "Treppe Bewegungsmelder unten"
    device_class: motion
    id: rgbtreppe_pir_u

    on_press:
      then:
        - script.execute: treppe_rauf_aktivieren


  # ------------------------------------------------------------
  # PIR TOP
  # ------------------------------------------------------------

  - platform: gpio
    pin:
      number: ${pir_up_pin}
      mode:
        input: true

    name: "Treppe Bewegungsmelder oben"
    device_class: motion
    id: rgbtreppe_pir_o

    on_press:
      then:
        - script.execute: treppe_runter_aktivieren


# ==============================================================
# MAIN ENABLE SWITCH
# ==============================================================

switch:

  - platform: template
    name: "Treppe Aktiviert"
    id: treppe_aktiv
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON


# ==============================================================
# SCRIPTS
# ==============================================================

script:

  # ============================================================
  # BOTTOM PIR -> LIGHT UP
  # ============================================================

  - id: treppe_rauf_aktivieren
    mode: restart

    then:

      - if:
          condition:
            - switch.is_on: treppe_aktiv

            # Light sensor:
            # active only if sensor is below threshold
            # OR light sensor is disabled.
            - or:
                - lambda: |-
                    return id(rgbtreppe_helligkeitssensor).state <
                           ${lightlevel_maxvalue};
                - lambda: |-
                    return ${light_sensor_active} == false;

            # Sun:
            # active after sunset
            # OR sun control is disabled.
            - or:
                - not:
                    - wifi.connected
                - sun.is_below_horizon
                - lambda: |-
                    return ${sun_active} == false;

            # Do not start if another direction is running.
            - lambda: |-
                return !id(treppe_rauf_laeuft) &&
                       !id(treppe_runter_laeuft);

          then:

            - text_sensor.template.publish:
                id: treppen_status
                state: "Treppe rauf"

            - lambda: |-
                id(treppe_rauf_laeuft) = true;

            - light.turn_on:
                id: rgbtreppe_led
                effect: ${led_effect_up}

      # --------------------------------------------------------
      # Wait for PIR at TOP or timeout.
      # --------------------------------------------------------

      - if:
          condition:
            - lambda: |-
                return id(treppe_rauf_laeuft);

          then:

            - wait_until:
                timeout: ${timeout_seconds}
                condition:
                  binary_sensor.is_on: rgbtreppe_pir_o

            - script.execute: treppe_rauf_deaktivieren


  # ============================================================
  # TOP PIR -> LIGHT DOWN
  # ============================================================

  - id: treppe_runter_aktivieren
    mode: restart

    then:

      - if:
          condition:
            - switch.is_on: treppe_aktiv

            - or:
                - lambda: |-
                    return id(rgbtreppe_helligkeitssensor).state <
                           ${lightlevel_maxvalue};
                - lambda: |-
                    return ${light_sensor_active} == false;

            - or:
                - not:
                    - wifi.connected
                - sun.is_below_horizon
                - lambda: |-
                    return ${sun_active} == false;

            - lambda: |-
                return !id(treppe_rauf_laeuft) &&
                       !id(treppe_runter_laeuft);

          then:

            - text_sensor.template.publish:
                id: treppen_status
                state: "Treppe runter"

            - lambda: |-
                id(treppe_runter_laeuft) = true;

            - light.turn_on:
                id: rgbtreppe_led
                effect: ${led_effect_down}

      # --------------------------------------------------------
      # Wait for PIR at BOTTOM or timeout.
      # --------------------------------------------------------

      - if:
          condition:
            - lambda: |-
                return id(treppe_runter_laeuft);

          then:

            - wait_until:
                timeout: ${timeout_seconds}
                condition:
                  binary_sensor.is_on: rgbtreppe_pir_u

            - script.execute: treppe_runter_deaktivieren


  # ============================================================
  # SWITCH OFF AFTER MOVEMENT FROM BOTTOM
  # ============================================================

  - id: treppe_rauf_deaktivieren
    mode: restart

    then:

      - delay: ${switchoff_delay_seconds}

      # --------------------------------------------------------
      # Optional animated switch-off
      # --------------------------------------------------------

      - if:
          condition:
            - lambda: |-
                return "${led_effect_up_off}"[0] != '\0';

          then:

            - light.turn_on:
                id: rgbtreppe_led
                effect: ${led_effect_up_off}

            - delay: ${led_effect_off_timeout}

      # --------------------------------------------------------
      # Complete OFF
      # --------------------------------------------------------

      - light.turn_off:
          id: rgbtreppe_led

      # --------------------------------------------------------
      # Cooldown
      # --------------------------------------------------------

      - delay: ${cooldown_seconds}

      - lambda: |-
          id(treppe_rauf_laeuft) = false;

      - text_sensor.template.publish:
          id: treppen_status
          state: "idle"


  # ============================================================
  # SWITCH OFF AFTER MOVEMENT FROM TOP
  # ============================================================

  - id: treppe_runter_deaktivieren
    mode: restart

    then:

      - delay: ${switchoff_delay_seconds}

      # --------------------------------------------------------
      # Optional animated switch-off
      # --------------------------------------------------------

      - if:
          condition:
            - lambda: |-
                return "${led_effect_down_off}"[0] != '\0';

          then:

            - light.turn_on:
                id: rgbtreppe_led
                effect: ${led_effect_down_off}

            - delay: ${led_effect_off_timeout}

      # --------------------------------------------------------
      # Complete OFF
      # --------------------------------------------------------

      - light.turn_off:
          id: rgbtreppe_led

      # --------------------------------------------------------
      # Cooldown
      # --------------------------------------------------------

      - delay: ${cooldown_seconds}

      - lambda: |-
          id(treppe_runter_laeuft) = false;

      - text_sensor.template.publish:
          id: treppen_status
          state: "idle"


# ==============================================================
# WS2812 LED STRIP
# ==============================================================

light:

  - platform: esp32_rmt_led_strip

    id: rgbtreppe_led
    name: "Treppe Oben LED"

    pin: ${led_pin}

    chipset: WS2812
    rgb_order: GRB

    num_leds: ${led_anzahl}

    # ESP32-S3 RMT.
    # DMA is useful for a long 576 LED strip.
    use_dma: true

    # Approximately 60 Hz maximum refresh.
    max_refresh_rate: 16ms

    restore_mode: ALWAYS_OFF

    # IMPORTANT:
    # Stair effects are controlled directly by the addressable
    # lambda. No 3-second light transition should interfere
    # with the stair animation.

    on_turn_off:
      - text_sensor.template.publish:
          id: treppen_status
          state: "idle"


    # ==========================================================
    # EFFECTS
    # ==========================================================

    effects:

      # ========================================================
      # RAINBOW
      # ========================================================

      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 90


      # ========================================================
      # COLOR WIPE DOWN
      # ========================================================

      - addressable_color_wipe:
          name: "Color Wipe Down"

          colors:

            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 30

            - red: 30%
              green: 100%
              blue: 60%
              num_leds: 30

          add_led_interval: 50ms
          reverse: false


      # ========================================================
      # COLOR WIPE UP
      # ========================================================

      - addressable_color_wipe:
          name: "Color Wipe Up"

          colors:

            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 30

            - red: 30%
              green: 100%
              blue: 60%
              num_leds: 30

          add_led_interval: 50ms
          reverse: true


      # ========================================================
      # ROCKET
      # ========================================================

      - addressable_color_wipe:
          name: "Rocket"

          colors:

            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 3

            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 2

            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 3

            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 2

            - red: 10%
              green: 5%
              blue: 2%
              num_leds: 1

            - red: 30%
              green: 15%
              blue: 6%
              num_leds: 1

            - red: 70%
              green: 30%
              blue: 10%
              num_leds: 1

            - red: 100%
              green: 80%
              blue: 20%
              num_leds: 1

            - red: 100%
              green: 40%
              blue: 10%
              num_leds: 1

            - red: 10%
              green: 5%
              blue: 1%
              num_leds: 1

            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1

            - red: 10%
              green: 5%
              blue: 1%
              num_leds: 1

            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 155

          add_led_interval: 20ms
          reverse: true


      # ========================================================
      # FIREWORK
      # ========================================================

      - addressable_fireworks:
          name: "Firework"
          update_interval: 32ms
          spark_probability: 40%
          use_random_color: true
          fade_out_rate: 120


      # ========================================================
      # STUFENLICHT RAUF
      #
      # One-shot:
      # 0 -> 1 -> 2 -> ... -> 15
      #
      # Each step gets one random color and keeps it.
      # ========================================================

      - addressable_lambda:
          name: "Stufenlicht rauf"
          update_interval: 16ms

          lambda: |-

            static const int16_t anzahl = ${stufen_anzahl};

            const int ledStufe[anzahl] = ${leds_pro_stufe};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            // New effect.
            if (initial_run) {
              progress = 0;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            // Wait 300 ms between steps.
            if (millis() - last_time < 300) {
              return;
            }

            last_time = millis();

            if (progress >= anzahl) {
              return;
            }

            int von = 0;

            for (int stufe = 0; stufe < anzahl; stufe++) {

              if (stufe == progress) {

                it.range(
                  von,
                  von + ledStufe[stufe]
                ) = esphome::Color::random_color();

                break;
              }

              von += ledStufe[stufe];
            }

            progress++;


      # ========================================================
      # STUFENLICHT RAUF ANIMIERT
      #
      # Repeats continuously.
      # ========================================================

      - addressable_lambda:
          name: "Stufenlicht rauf animiert"
          update_interval: 16ms

          lambda: |-

            static const int16_t anzahl = ${stufen_anzahl};

            const int ledStufe[anzahl] = ${leds_pro_stufe};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = 0;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 300) {
              return;
            }

            last_time = millis();

            int von = 0;

            for (int stufe = 0; stufe < anzahl; stufe++) {

              if (stufe == progress) {

                it.range(
                  von,
                  von + ledStufe[stufe]
                ) = esphome::Color::random_color();

                break;
              }

              von += ledStufe[stufe];
            }

            progress++;

            if (progress >= anzahl) {
              progress = 0;
            }


      # ========================================================
      # STUFENLICHT RAUF COLORIZED
      #
      # Uses the configured color for every step.
      # ========================================================

      - addressable_lambda:
          name: "Stufenlicht rauf colorized"
          update_interval: 16ms

          lambda: |-

            static const int16_t anzahl = ${stufen_anzahl};

            const int ledStufe[anzahl] = ${leds_pro_stufe};

            const esphome::Color ledStufenFarbe[anzahl] =
              ${farbe_je_stufe};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = 0;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 200) {
              return;
            }

            last_time = millis();

            if (progress >= anzahl) {
              return;
            }

            int von = 0;

            for (int stufe = 0; stufe < anzahl; stufe++) {

              if (stufe == progress) {

                it.range(
                  von,
                  von + ledStufe[stufe]
                ) = ledStufenFarbe[stufe];

                break;
              }

              von += ledStufe[stufe];
            }

            progress++;


      # ========================================================
      # STUFENLICHT RAUF AUS
      #
      # 0 -> 1 -> 2 -> ... -> 15 OFF
      # ========================================================

      - addressable_lambda:
          name: "Stufenlicht rauf aus"
          update_interval: 16ms

          lambda: |-

            static const int16_t anzahl = ${stufen_anzahl};

            const int ledStufe[anzahl] = ${leds_pro_stufe};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = 0;
              last_time = millis();
              return;
            }

            if (millis() - last_time < 500) {
              return;
            }

            last_time = millis();

            if (progress >= anzahl) {
              return;
            }

            int von = 0;

            for (int stufe = 0; stufe < anzahl; stufe++) {

              if (stufe == progress) {

                it.range(
                  von,
                  von + ledStufe[stufe]
                ) = esphome::Color(0, 0, 0);

                break;
              }

              von += ledStufe[stufe];
            }

            progress++;


      # ========================================================
      # STUFENLICHT RUNTER
      #
      # 15 -> 14 -> ... -> 0
      # ========================================================

      - addressable_lambda:
          name: "Stufenlicht runter"
          update_interval: 16ms

          lambda: |-

            static const int16_t anzahl = ${stufen_anzahl};

            const int ledStufe[anzahl] = ${leds_pro_stufe};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = anzahl - 1;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 300) {
              return;
            }

            last_time = millis();

            if (progress < 0) {
              return;
            }

            int von = 0;

            for (int stufe = 0; stufe < anzahl; stufe++) {

              if (stufe == progress) {

                it.range(
                  von,
                  von + ledStufe[stufe]
                ) = esphome::Color::random_color();

                break;
              }

              von += ledStufe[stufe];
            }

            progress--;


      # ========================================================
      # STUFENLICHT RUNTER ANIMIERT
      #
      # 15 -> 14 -> ... -> 0 -> 15 -> ...
      # ========================================================

      - addressable_lambda:
          name: "Stufenlicht runter animiert"
          update_interval: 16ms

          lambda: |-

            static const int16_t anzahl = ${stufen_anzahl};

            const int ledStufe[anzahl] = ${leds_pro_stufe};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = anzahl - 1;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 300) {
              return;
            }

            last_time = millis();

            int von = 0;

            for (int stufe = 0; stufe < anzahl; stufe++) {

              if (stufe == progress) {

                it.range(
                  von,
                  von + ledStufe[stufe]
                ) = esphome::Color::random_color();

                break;
              }

              von += ledStufe[stufe];
            }

            progress--;

            if (progress < 0) {
              progress = anzahl - 1;
            }


      # ========================================================
      # STUFENLICHT RUNTER COLORIZED
      #
      # 15 -> 14 -> ... -> 0
      # ========================================================

      - addressable_lambda:
          name: "Stufenlicht runter colorized"
          update_interval: 16ms

          lambda: |-

            static const int16_t anzahl = ${stufen_anzahl};

            const int ledStufe[anzahl] = ${leds_pro_stufe};

            const esphome::Color ledStufenFarbe[anzahl] =
              ${farbe_je_stufe};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = anzahl - 1;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 200) {
              return;
            }

            last_time = millis();

            if (progress < 0) {
              return;
            }

            int von = 0;

            for (int stufe = 0; stufe < anzahl; stufe++) {

              if (stufe == progress) {

                it.range(
                  von,
                  von + ledStufe[stufe]
                ) = ledStufenFarbe[stufe];

                break;
              }

              von += ledStufe[stufe];
            }

            progress--;


      # ========================================================
      # STUFENLICHT RUNTER AUS
      #
      # 15 -> 14 -> ... -> 0 OFF
      # ========================================================

      - addressable_lambda:
          name: "Stufenlicht runter aus"
          update_interval: 16ms

          lambda: |-

            static const int16_t anzahl = ${stufen_anzahl};

            const int ledStufe[anzahl] = ${leds_pro_stufe};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = anzahl - 1;
              last_time = millis();
              return;
            }

            if (millis() - last_time < 500) {
              return;
            }

            last_time = millis();

            if (progress < 0) {
              return;
            }

            int von = 0;

            for (int stufe = 0; stufe < anzahl; stufe++) {

              if (stufe == progress) {

                it.range(
                  von,
                  von + ledStufe[stufe]
                ) = esphome::Color(0, 0, 0);

                break;
              }

              von += ledStufe[stufe];
            }

            progress--;
