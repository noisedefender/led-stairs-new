substitutions:

  # ============================================================
  # HARDWARE
  # ============================================================

  lightlevel_pin: GPIO1
  pir_down_pin: GPIO2
  pir_up_pin: GPIO3
  led_pin: GPIO4

  # ============================================================
  # STAIR TIMING
  # ============================================================

  # Максимальное время работы после срабатывания PIR,
  # если движение на противоположном конце не обнаружено.
  timeout_seconds: 60s

  # Задержка перед началом выключения после PIR
  # на противоположном конце.
  switchoff_delay_seconds: 10s

  # После полного выключения лестница некоторое время
  # игнорирует PIR.
  cooldown_seconds: 5s

  # ============================================================
  # EFFECTS USED BY PIR
  # ============================================================

  led_effect_up: "Step Light Up Colorized"
  led_effect_down: "Step Light Down Colorized"

  led_effect_up_off: "Step Light Up Off"
  led_effect_down_off: "Step Light Down Off"

  led_effect_off_timeout: 10s

  # ============================================================
  # STAIR CONFIGURATION
  # ============================================================

  step_count: "16"

  # Количество LED на каждой ступени.
  # Сумма должна совпадать с led_count.
  leds_per_step: "{36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36, 36}"

  # Цвет каждой ступени.
  # RGB 0..255.
  step_colors: "{Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181), Color(39,111,181)}"

  # Общее количество LED.
  led_count: "576"

  # ============================================================
  # LIGHT SENSOR
  # ============================================================

  light_sensor_active: "false"

  # При значении ниже этого уровня лестница разрешена.
  lightlevel_maxvalue: "0.7"

  # ============================================================
  # SUN
  # ============================================================

  sun_active: "false"

latitude: "51.138374"
longitude: "7.185790"

  # ============================================================
  # WIFI
  # ============================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "SHYS RGB Staircase Fallback"
    password: !secret fallback_password


# ==============================================================
# ESPHOME
# ==============================================================

esphome:
  name: shys-rgb-staircase
  friendly_name: SHYS RGB Staircase

  on_boot:
    priority: 500
    then:
      - switch.turn_on: staircase_enabled


# ==============================================================
# ESP32-S3
# ==============================================================

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino


logger:


# ==============================================================
# API
# ==============================================================

api:


# ==============================================================
# OTA
# ==============================================================

ota:
  - platform: esphome


# ==============================================================
# CAPTIVE PORTAL
# ==============================================================

captive_portal:


# ==============================================================
# GLOBALS
# ==============================================================

globals:

  # true во время движения снизу вверх
  - id: staircase_up_running
    type: bool
    restore_value: no
    initial_value: "false"

  # true во время движения сверху вниз
  - id: staircase_down_running
    type: bool
    restore_value: no
    initial_value: "false"


# ==============================================================
# SUN
# ==============================================================

sun:
  latitude: ${latitude}
  longitude: ${longitude}


# ==============================================================
# TIME
# ==============================================================

time:

  - platform: homeassistant
    id: local_time

  - platform: sntp
    id: sntp_time


# ==============================================================
# TEXT SENSOR
# ==============================================================

text_sensor:

  - platform: template
    name: "Staircase Status"
    id: staircase_status
    lambda: |-
      return {"idle"};


# ==============================================================
# LIGHT SENSOR
# ==============================================================

sensor:

  - platform: adc
    pin: ${lightlevel_pin}
    name: "RGB Staircase Light Sensor"
    id: staircase_light_sensor
    update_interval: 30s


# ==============================================================
# PIR SENSORS
# ==============================================================

binary_sensor:

  # ------------------------------------------------------------
  # PIR BOTTOM
  # ------------------------------------------------------------

  - platform: gpio
    pin:
      number: ${pir_down_pin}
      mode:
        input: true

    name: "Staircase Motion Sensor Bottom"
    device_class: motion
    id: staircase_pir_bottom

    on_press:
      then:
        - script.execute: activate_staircase_up


  # ------------------------------------------------------------
  # PIR TOP
  # ------------------------------------------------------------

  - platform: gpio
    pin:
      number: ${pir_up_pin}
      mode:
        input: true

    name: "Staircase Motion Sensor Top"
    device_class: motion
    id: staircase_pir_top

    on_press:
      then:
        - script.execute: activate_staircase_down


# ==============================================================
# MAIN ENABLE SWITCH
# ==============================================================

switch:

  - platform: template
    name: "Staircase Enabled"
    id: staircase_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON


# ==============================================================
# SCRIPTS
# ==============================================================

script:

  # ============================================================
  # BOTTOM PIR -> LIGHT UP
  # ============================================================

  - id: activate_staircase_up
    mode: single

    then:

      - if:
          condition:
            - switch.is_on: staircase_enabled

            # Light sensor:
            # active only if sensor is below threshold
            # OR light sensor is disabled.
            - or:
                - lambda: |-
                    return id(staircase_light_sensor).state <
                           ${lightlevel_maxvalue};
                - lambda: |-
                    return ${light_sensor_active} == false;

            # Sun:
            # active after sunset
            # OR sun control is disabled.
            - or:
                - not:
                    - wifi.connected
                - sun.is_below_horizon
                - lambda: |-
                    return ${sun_active} == false;

            # Do not start if another direction is running.
            - lambda: |-
                return !id(staircase_up_running) &&
                       !id(staircase_down_running);

          then:

            - text_sensor.template.publish:
                id: staircase_status
                state: "Staircase Up"

            - lambda: |-
                id(staircase_up_running) = true;

            - light.turn_on:
                id: staircase_led
                effect: ${led_effect_up}

      # --------------------------------------------------------
      # Wait for PIR at TOP or timeout.
      # --------------------------------------------------------

      - if:
          condition:
            - lambda: |-
                return id(staircase_up_running);

          then:

            - wait_until:
                timeout: ${timeout_seconds}
                condition:
                  binary_sensor.is_on: staircase_pir_top

            - script.execute: deactivate_staircase_up


  # ============================================================
  # TOP PIR -> LIGHT DOWN
  # ============================================================

  - id: activate_staircase_down
    mode: single

    then:

      - if:
          condition:
            - switch.is_on: staircase_enabled

            - or:
                - lambda: |-
                    return id(staircase_light_sensor).state <
                           ${lightlevel_maxvalue};
                - lambda: |-
                    return ${light_sensor_active} == false;

            - or:
                - not:
                    - wifi.connected
                - sun.is_below_horizon
                - lambda: |-
                    return ${sun_active} == false;

            - lambda: |-
                return !id(staircase_up_running) &&
                       !id(staircase_down_running);

          then:

            - text_sensor.template.publish:
                id: staircase_status
                state: "Staircase Down"

            - lambda: |-
                id(staircase_down_running) = true;

            - light.turn_on:
                id: staircase_led
                effect: ${led_effect_down}

      # --------------------------------------------------------
      # Wait for PIR at BOTTOM or timeout.
      # --------------------------------------------------------

      - if:
          condition:
            - lambda: |-
                return id(staircase_down_running);

          then:

            - wait_until:
                timeout: ${timeout_seconds}
                condition:
                  binary_sensor.is_on: staircase_pir_bottom

            - script.execute: deactivate_staircase_down


  # ============================================================
  # SWITCH OFF AFTER MOVEMENT FROM BOTTOM
  # ============================================================

  - id: deactivate_staircase_up
    mode: restart

    then:

      - delay: ${switchoff_delay_seconds}

      # --------------------------------------------------------
      # Optional animated switch-off
      # --------------------------------------------------------

      - if:
          condition:
            - lambda: |-
                return "${led_effect_up_off}"[0] != '\0';

          then:

            - light.turn_on:
                id: staircase_led
                effect: ${led_effect_up_off}

            - delay: ${led_effect_off_timeout}

      # --------------------------------------------------------
      # Complete OFF
      # --------------------------------------------------------

      - light.turn_off:
          id: staircase_led

      # --------------------------------------------------------
      # Cooldown
      # --------------------------------------------------------

      - delay: ${cooldown_seconds}

      - lambda: |-
          id(staircase_up_running) = false;

      - text_sensor.template.publish:
          id: staircase_status
          state: "idle"


  # ============================================================
  # SWITCH OFF AFTER MOVEMENT FROM TOP
  # ============================================================

  - id: deactivate_staircase_down
    mode: restart

    then:

      - delay: ${switchoff_delay_seconds}

      # --------------------------------------------------------
      # Optional animated switch-off
      # --------------------------------------------------------

      - if:
          condition:
            - lambda: |-
                return "${led_effect_down_off}"[0] != '\0';

          then:

            - light.turn_on:
                id: staircase_led
                effect: ${led_effect_down_off}

            - delay: ${led_effect_off_timeout}

      # --------------------------------------------------------
      # Complete OFF
      # --------------------------------------------------------

      - light.turn_off:
          id: staircase_led

      # --------------------------------------------------------
      # Cooldown
      # --------------------------------------------------------

      - delay: ${cooldown_seconds}

      - lambda: |-
          id(staircase_down_running) = false;

      - text_sensor.template.publish:
          id: staircase_status
          state: "idle"


# ==============================================================
# WS2812 LED STRIP
# ==============================================================

light:

  - platform: esp32_rmt_led_strip

    id: staircase_led
    name: "Staircase LED"

    pin: ${led_pin}

    chipset: WS2812
    rgb_order: GRB

    num_leds: ${led_count}

    # ESP32-S3 RMT.
    # DMA is useful for a long 576 LED strip.
    use_dma: true

    # Approximately 60 Hz maximum refresh.
    max_refresh_rate: 16ms

    restore_mode: ALWAYS_OFF

    # IMPORTANT:
    # Stair effects are controlled directly by the addressable
    # lambda. No 3-second light transition should interfere
    # with the stair animation.

    on_turn_off:
      - text_sensor.template.publish:
          id: staircase_status
          state: "idle"


    # ==========================================================
    # EFFECTS
    # ==========================================================

    effects:

      # ========================================================
      # RAINBOW
      # ========================================================

      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 90


      # ========================================================
      # COLOR WIPE DOWN
      # ========================================================

      - addressable_color_wipe:
          name: "Color Wipe Down"

          colors:

            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 30

            - red: 30%
              green: 100%
              blue: 60%
              num_leds: 30

          add_led_interval: 50ms
          reverse: false


      # ========================================================
      # COLOR WIPE UP
      # ========================================================

      - addressable_color_wipe:
          name: "Color Wipe Up"

          colors:

            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 30

            - red: 30%
              green: 100%
              blue: 60%
              num_leds: 30

          add_led_interval: 50ms
          reverse: true


      # ========================================================
      # ROCKET
      # ========================================================

      - addressable_color_wipe:
          name: "Rocket"

          colors:

            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 3

            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 2

            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 3

            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 2

            - red: 10%
              green: 5%
              blue: 2%
              num_leds: 1

            - red: 30%
              green: 15%
              blue: 6%
              num_leds: 1

            - red: 70%
              green: 30%
              blue: 10%
              num_leds: 1

            - red: 100%
              green: 80%
              blue: 20%
              num_leds: 1

            - red: 100%
              green: 40%
              blue: 10%
              num_leds: 1

            - red: 10%
              green: 5%
              blue: 1%
              num_leds: 1

            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1

            - red: 10%
              green: 5%
              blue: 1%
              num_leds: 1

            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 155

          add_led_interval: 20ms
          reverse: true


      # ========================================================
      # FIREWORK
      # ========================================================

      - addressable_fireworks:
          name: "Firework"
          update_interval: 32ms
          spark_probability: 40%
          use_random_color: true
          fade_out_rate: 120


      # ========================================================
      # STEP LIGHT UP
      #
      # One-shot:
      # 0 -> 1 -> 2 -> ... -> 15
      #
      # Each step gets one random color and keeps it.
      # ========================================================

      - addressable_lambda:
          name: "Step Light Up"
          update_interval: 16ms

          lambda: |-

            static const int16_t step_count = ${step_count};

            const int leds_per_step[step_count] = ${leds_per_step};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            // New effect.
            if (initial_run) {
              progress = 0;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            // Wait 300 ms between steps.
            if (millis() - last_time < 300) {
              return;
            }

            last_time = millis();

            if (progress >= step_count) {
              return;
            }

            int from_led = 0;

            for (int step = 0; step < step_count; step++) {

              if (step == progress) {

                it.range(
                  from_led,
                  from_led + leds_per_step[step]
                ) = esphome::Color::random_color();

                break;
              }

              from_led += leds_per_step[step];
            }

            progress++;


      # ========================================================
      # STEP LIGHT UP ANIMIERT
      #
      # Repeats continuously.
      # ========================================================

      - addressable_lambda:
          name: "Step Light Up Animated"
          update_interval: 16ms

          lambda: |-

            static const int16_t step_count = ${step_count};

            const int leds_per_step[step_count] = ${leds_per_step};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = 0;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 300) {
              return;
            }

            last_time = millis();

            int from_led = 0;

            for (int step = 0; step < step_count; step++) {

              if (step == progress) {

                it.range(
                  from_led,
                  from_led + leds_per_step[step]
                ) = esphome::Color::random_color();

                break;
              }

              from_led += leds_per_step[step];
            }

            progress++;

            if (progress >= step_count) {
              progress = 0;
            }


      # ========================================================
      # STEP LIGHT UP COLORIZED
      #
      # Uses the configured color for every step.
      # ========================================================

      - addressable_lambda:
          name: "Step Light Up Colorized"
          update_interval: 16ms

          lambda: |-

            static const int16_t step_count = ${step_count};

            const int leds_per_step[step_count] = ${leds_per_step};

            const esphome::Color step_colors[step_count] =
              ${step_colors};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = 0;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 200) {
              return;
            }

            last_time = millis();

            if (progress >= step_count) {
              return;
            }

            int from_led = 0;

            for (int step = 0; step < step_count; step++) {

              if (step == progress) {

                it.range(
                  from_led,
                  from_led + leds_per_step[step]
                ) = step_colors[step];

                break;
              }

              from_led += leds_per_step[step];
            }

            progress++;


      # ========================================================
      # STEP LIGHT UP OFF
      #
      # 0 -> 1 -> 2 -> ... -> 15 OFF
      # ========================================================

      - addressable_lambda:
          name: "Step Light Up Off"
          update_interval: 16ms

          lambda: |-

            static const int16_t step_count = ${step_count};

            const int leds_per_step[step_count] = ${leds_per_step};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = 0;
              last_time = millis();
              return;
            }

            if (millis() - last_time < 500) {
              return;
            }

            last_time = millis();

            if (progress >= step_count) {
              return;
            }

            int from_led = 0;

            for (int step = 0; step < step_count; step++) {

              if (step == progress) {

                it.range(
                  from_led,
                  from_led + leds_per_step[step]
                ) = esphome::Color(0, 0, 0);

                break;
              }

              from_led += leds_per_step[step];
            }

            progress++;


      # ========================================================
      # STEP LIGHT DOWN
      #
      # 15 -> 14 -> ... -> 0
      # ========================================================

      - addressable_lambda:
          name: "Step Light Down"
          update_interval: 16ms

          lambda: |-

            static const int16_t step_count = ${step_count};

            const int leds_per_step[step_count] = ${leds_per_step};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = step_count - 1;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 300) {
              return;
            }

            last_time = millis();

            if (progress < 0) {
              return;
            }

            int from_led = 0;

            for (int step = 0; step < step_count; step++) {

              if (step == progress) {

                it.range(
                  from_led,
                  from_led + leds_per_step[step]
                ) = esphome::Color::random_color();

                break;
              }

              from_led += leds_per_step[step];
            }

            progress--;


      # ========================================================
      # STEP LIGHT DOWN ANIMATED
      #
      # 15 -> 14 -> ... -> 0 -> 15 -> ...
      # ========================================================

      - addressable_lambda:
          name: "Step Light Down Animated"
          update_interval: 16ms

          lambda: |-

            static const int16_t step_count = ${step_count};

            const int leds_per_step[step_count] = ${leds_per_step};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = step_count - 1;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 300) {
              return;
            }

            last_time = millis();

            int from_led = 0;

            for (int step = 0; step < step_count; step++) {

              if (step == progress) {

                it.range(
                  from_led,
                  from_led + leds_per_step[step]
                ) = esphome::Color::random_color();

                break;
              }

              from_led += leds_per_step[step];
            }

            progress--;

            if (progress < 0) {
              progress = step_count - 1;
            }


      # ========================================================
      # STEP LIGHT DOWN COLORIZED
      #
      # 15 -> 14 -> ... -> 0
      # ========================================================

      - addressable_lambda:
          name: "Step Light Down Colorized"
          update_interval: 16ms

          lambda: |-

            static const int16_t step_count = ${step_count};

            const int leds_per_step[step_count] = ${leds_per_step};

            const esphome::Color step_colors[step_count] =
              ${step_colors};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = step_count - 1;
              last_time = millis();

              it.all() = esphome::Color::BLACK;
              return;
            }

            if (millis() - last_time < 200) {
              return;
            }

            last_time = millis();

            if (progress < 0) {
              return;
            }

            int from_led = 0;

            for (int step = 0; step < step_count; step++) {

              if (step == progress) {

                it.range(
                  from_led,
                  from_led + leds_per_step[step]
                ) = step_colors[step];

                break;
              }

              from_led += leds_per_step[step];
            }

            progress--;


      # ========================================================
      # STEP LIGHT DOWN OFF
      #
      # 15 -> 14 -> ... -> 0 OFF
      # ========================================================

      - addressable_lambda:
          name: "Step Light Down Off"
          update_interval: 16ms

          lambda: |-

            static const int16_t step_count = ${step_count};

            const int leds_per_step[step_count] = ${leds_per_step};

            static int16_t progress = 0;
            static uint32_t last_time = 0;

            if (initial_run) {
              progress = step_count - 1;
              last_time = millis();
              return;
            }

            if (millis() - last_time < 500) {
              return;
            }

            last_time = millis();

            if (progress < 0) {
              return;
            }

            int from_led = 0;

            for (int step = 0; step < step_count; step++) {

              if (step == progress) {

                it.range(
                  from_led,
                  from_led + leds_per_step[step]
                ) = esphome::Color(0, 0, 0);

                break;
              }

              from_led += leds_per_step[step];
            }

            progress--;
